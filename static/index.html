<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои задачи</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f5f7fb; }
    section { background: white; padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 10px; margin: 6px 0; }
    button { cursor: pointer; background: #2563eb; border: 0; border-radius: 6px; color: white; }
    .task { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ddd; padding: 12px 0; }
    .done { text-decoration: line-through; color: #777; }
    .hidden { display: none; }
    .filters {
      display: flex;
      gap: 8px;
    }

    .filters button {
      flex: 1;
      width: auto;
    }
    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 150px;
    }

    .task-actions button {
      width: auto;
      margin: 0;
    }
    .view-switcher,
    .calendar-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }

    .view-switcher button,
    .calendar-toolbar button {
      width: auto;
      flex: 1;
    }

    .calendar-toolbar strong {
      text-align: center;
      flex: 2;
    }

    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-day {
      min-height: 100px;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    .calendar-day-number {
      font-weight: bold;
    }

    .calendar-task {
      margin-top: 5px;
      padding: 4px;
      border-radius: 4px;
      background: #dbeafe;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #message { color: #b91c1c; }
    .overdue { color: #b91c1c; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Мои задачи</h1>
  <p id="message"></p>

  <section id="auth">
    <h2>Регистрация или вход</h2>
    <input id="username" placeholder="Логин">
    <input id="password" type="password" placeholder="Пароль">
    <button onclick="register()">Зарегистрироваться</button>
    <button onclick="login()">Войти</button>
  </section>

  <section id="app" class="hidden">
    <button onclick="logout()">Выйти</button>
    <h2>Новая задача</h2>
    <input id="title" placeholder="Название задачи">
    <textarea id="description" placeholder="Описание (необязательно)"></textarea>
    <input id="due_date" type="date">
    <button onclick="createTask()">Добавить задачу</button>

    

    <h2>Задачи</h2>

    <div class="view-switcher">
      <button onclick="setView('list')">Список</button>
      <button onclick="setView('calendar')">Календарь</button>
    </div>

    <div id="list-view">
      <div class="filters">
        <button onclick="setFilter('all')">Все</button>
        <button onclick="setFilter('active')">Активные</button>
        <button onclick="setFilter('done')">Выполненные</button>
      </div>

      <div id="tasks"></div>
    </div>

    <div id="calendar-view" class="hidden">
      <div class="calendar-toolbar">
        <button onclick="changeCalendarMonth(-1)">←</button>
        <strong id="calendar-title"></strong>
        <button onclick="changeCalendarMonth(1)">→</button>
      </div>
      <div class="view-switcher">
        <button onclick="setCalendarMode('month')">Месяц</button>
        <button onclick="setCalendarMode('week')">Неделя</button>
      </div>
      <div id="calendar"></div>
    </div>

    <div id="tasks"></div>
  </section>

  <script>
    const token = localStorage.getItem("token");

    if (token) showApp();

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${localStorage.getItem("token")}`,
      };
    }

    async function register() {
      const response = await fetch("/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });

      if (!response.ok) {
        showMessage("Не удалось зарегистрироваться");
        return;
      }

      showMessage("Пользователь создан. Теперь войдите.");
    }

    async function login() {
      const form = new URLSearchParams();
      form.append("username", document.getElementById("username").value);
      form.append("password", document.getElementById("password").value);

      const response = await fetch("/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });

      if (!response.ok) {
        showMessage("Неверный логин или пароль");
        return;
      }

      const data = await response.json();
      localStorage.setItem("token", data.access_token);
      showApp();
    }

    function showApp() {
      document.getElementById("auth").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      showMessage("");
      loadTasks();
    }

    function logout() {
      localStorage.removeItem("token");
      location.reload();
    }
    

    let currentFilter = "all";

    let currentView = "list";
    let allTasks = [];
    let calendarDate = new Date();
    let calendarMode = "month";

    function setFilter(filter) {
      currentFilter = filter;
      loadTasks();
    }
    function setView(view) {
      currentView = view;

      document.getElementById("list-view").classList.toggle(
        "hidden",
        view !== "list"
      );

      document.getElementById("calendar-view").classList.toggle(
        "hidden",
        view !== "calendar"
      );

      if (view === "calendar") {
        renderCalendar();
      }
    }

    function setCalendarMode(mode) {
      calendarMode = mode;
      renderCalendar();
    }

    function changeCalendarMonth(offset) {
      if (calendarMode === "week") {
        calendarDate.setDate(calendarDate.getDate() + offset * 7);
      } else {
        calendarDate.setMonth(calendarDate.getMonth() + offset);
      }

      renderCalendar();
    }

    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      const title = document.getElementById("calendar-title");
      if (calendarMode === "week") {
        renderWeek(calendar, title);
        return;
      }

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      title.textContent = calendarDate.toLocaleDateString("ru-RU", {
        month: "long",
        year: "numeric",
      });

      const weekDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
      calendar.innerHTML = weekDays
        .map(day => `<div class="calendar-day-number">${day}</div>`)
        .join("");

      const firstDay = new Date(year, month, 1);
      const emptyDays = (firstDay.getDay() + 6) % 7;

      for (let index = 0; index < emptyDays; index++) {
        calendar.innerHTML += `<div></div>`;
      }

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateString =
          `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        const dayTasks = allTasks.filter(task => task.due_date === dateString);

        calendar.innerHTML += `
          <div class="calendar-day">
            <div class="calendar-day-number">${day}</div>
            ${dayTasks
              .map(task => `<div class="calendar-task">${task.title}</div>`)
              .join("")}
          </div>
        `;
      }
    }



    function isOverdue(task) {
      const today = new Date().toISOString().slice(0, 10);
      return !task.done && task.due_date && task.due_date < today;
    }
    async function loadTasks() {
      const response = await fetch("/tasks", {
        headers: authHeaders(),
      });

      if (!response.ok) {
        logout();
        return;
      }

      const tasks = await response.json();
      allTasks = tasks;
      tasks.sort((firstTask, secondTask) => {
        if (!firstTask.due_date && !secondTask.due_date) return 0;
        if (!firstTask.due_date) return 1;
        if (!secondTask.due_date) return -1;

        return firstTask.due_date.localeCompare(secondTask.due_date);
      });
      const filteredTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.done;
        if (currentFilter === "done") return task.done;
        return true;
      });



      const container = document.getElementById("tasks");

      container.innerHTML = filteredTasks.map(task => `
        <div class="task">
          <span class="${task.done ? "done" : ""}">
            <strong>${task.title}</strong><br>
            ${task.description || ""}
            ${task.due_date ? "<br><span class='" + (isOverdue(task) ? "overdue" : "") + "'>Срок: " + task.due_date + "</span>" : ""}
          </span>
          <div class="task-actions">
            <button onclick="editTask(${task.id})">Редактировать</button>
            <button onclick="completeTask(${task.id})">Готово</button>
            <button onclick="deleteTask(${task.id})">Удалить</button>
          </div>
        </div>

      `).join("");
    }

    async function createTask() {
      const response = await fetch("/tasks", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          title: document.getElementById("title").value,
          description: document.getElementById("description").value || null,
          due_date: document.getElementById("due_date").value || null,
        }),
      });

      if (!response.ok) {
        showMessage("Не удалось создать задачу");
        return;
      }

      document.getElementById("title").value = "";
      document.getElementById("description").value = "";
      document.getElementById("due_date").value = "";
      loadTasks();
    }
    async function editTask(id) {
      const taskResponse = await fetch(`/tasks/${id}`, {
        headers: authHeaders(),
      });

      if (!taskResponse.ok) {
        showMessage("Не удалось получить задачу");
        return;
      }

      const task = await taskResponse.json();
      const newTitle = prompt("Новое название задачи:", task.title);

      if (newTitle === null) return;

      if (!newTitle.trim()) {
        showMessage("Название не может быть пустым");
        return;
      }

      const updateResponse = await fetch(`/tasks/${id}`, {
        method: "PUT",
        headers: authHeaders(),
        body: JSON.stringify({ title: newTitle.trim() }),
      });

      if (!updateResponse.ok) {
        showMessage("Не удалось обновить задачу");
        return;
      }

      loadTasks();
    }




    async function completeTask(id) {
      await fetch(`/tasks/${id}/done`, {
        method: "PUT",
        headers: authHeaders(),
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/tasks/${id}`, {
        method: "DELETE",
        headers: authHeaders(),
      });
      loadTasks();
    }

    function renderWeek(calendar, title) {
      const selectedDate = new Date(calendarDate);
      const dayIndex = (selectedDate.getDay() + 6) % 7;

      const monday = new Date(selectedDate);
      monday.setDate(selectedDate.getDate() - dayIndex);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      title.textContent =
        `${monday.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
        })} — ${sunday.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        })}`;

      const weekDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

      calendar.innerHTML = weekDays
        .map(day => `<div class="calendar-day-number">${day}</div>`)
        .join("");

      for (let offset = 0; offset < 7; offset++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + offset);

        const dateString =
          `${dayDate.getFullYear()}-${String(dayDate.getMonth() + 1).padStart(2, "0")}-${String(dayDate.getDate()).padStart(2, "0")}`;

        const dayTasks = allTasks.filter(task => task.due_date === dateString);

        calendar.innerHTML += `
          <div class="calendar-day">
            <div class="calendar-day-number">${dayDate.getDate()}</div>
            ${dayTasks
              .map(task => `<div class="calendar-task">${task.title}</div>`)
              .join("")}
          </div>
        `;
      }
    }

  </script>
</body>
</html>
